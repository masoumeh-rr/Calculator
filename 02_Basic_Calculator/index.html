<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCalculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <div class="glass">
            <input type="text" id="answer" readonly>
        </div>
        <div class="btncontainer">
            <button id="oparator">-</button>
            <button id="oparator">+</button>
            <button id="oparator" style="padding:15px 0 0 0;">*</button>
            <button id="oparator">/</button>
            <button id="numbers">9</button>
            <button id="numbers">8</button>
            <button id="numbers">7</button>
            <button id="clear">C</button>
            <button id="numbers">6</button>
            <button id="numbers">5</button>
            <button id="numbers">4</button>
            <button id="equal">=</button>
            <button id="numbers">3</button>
            <button id="numbers">2</button>
            <button id="numbers">1</button>
            <button id="dot">.</button>
            <button id="numbers">0</button>
            <button id="backspace" data-value="backspace"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    id="Keyboard-Backspace--Streamline-Sharp-Material" height="30" width="30">
                    <desc>
                        Keyboard Backspace Streamline Icon: https://streamlinehq.com
                    </desc>
                    <path fill="aliceblue"
                        d="M8.975 17.95 3 11.975 8.975 6l1.075 1.075 -4.15 4.15H21v1.5H5.9l4.15 4.15 -1.075 1.075Z"
                        stroke-width="1"></path>
                </svg> </button>
        </div>
    </div>
</body>
<script src="./script.js"></script>

</html>
