<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCalculator</title>
    <link rel="stylesheet" href="./Style/style.css">

</head>

<body>
    <div class="container">
        <div class="inputs">
            <p class="text">لطفا اعداد اول و دوم را وارد کنید و سپس روی عملیات ریاضی کلیک کنید. </p>
            <div class="numbers">
                <input type="text" id="num1" placeholder="عدد اول">
                <input type="text" id="num2" placeholder="عدد دوم">
            </div>
            <div class="resault">
                <input type="text" id="answer" placeholder="جواب" readonly>
            </div>
        </div>
        <div class="btncontainer">
            <button id="plus">+</button>
            <button id="minus">-</button>
            <button id="multiplication">*</button>
            <button id="division">/</button>
            <button id="restart">C</button>
        </div>
    </div>
</body>
<script src="./JS/javaScript.js"></script>

</html>
